[package]
name = "winbaobab"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
eframe = "=0.37.0"
rayon = "=1.12.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WNet", "Win32_System_Diagnostics_Debug", "Win32_System_WindowsProgramming", "Win32_System_Com", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "=0.62.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rfd = { version = "=0.17.2", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
tiny-skia = "=0.12.0"
ico = "=0.6.0"

[build-dependencies]
winresource = "=0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
